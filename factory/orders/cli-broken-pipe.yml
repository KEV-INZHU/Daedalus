objective: >-
  `daedalus` commands piped into a reader that closes early (`daedalus factory status | head`) currently
  crash with a BrokenPipeError traceback. Exit quietly instead, with the conventional status, without
  hiding real errors.
acceptance_criteria:
  - A command whose stdout is closed early exits without a traceback on stderr
  - Other exceptions are unaffected
scope: ["src/daedalus/cli.py", "tests/unit/test_cli_pipe.py"]
priority: 9
