[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
dynamic = ["version"]
description = "Harness-agnostic engineering control plane: deterministic lifecycle, revision-bound evidence, derived acceptance."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "KEV-INZHU" }]
keywords = ["ai", "agents", "coding-agents", "acceptance", "gate", "code-review", "claude-code", "codex", "ci", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/KEV-INZHU/Daedalus"
Documentation = "https://github.com/KEV-INZHU/Daedalus/blob/main/docs/index.md"
Source = "https://github.com/KEV-INZHU/Daedalus"
Issues = "https://github.com/KEV-INZHU/Daedalus/issues"
Changelog = "https://github.com/KEV-INZHU/Daedalus/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4", "ruff>=0.5"]

[project.scripts]
daedalus = "daedalus.cli:main"

[tool.setuptools.dynamic]
version = { attr = "daedalus.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daedalus = ["data/*.yaml", "data/skills/*/*.md", "data/harness/*/*", "data/demo/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"  # the oldest supported Python: newer-only syntax is a lint error
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned so a newer ruff's wider defaults cannot break CI: real errors (syntax, imports, undefined
# names, unused code), not style preferences.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E402", "E702"]  # style the code base already uses on purpose
