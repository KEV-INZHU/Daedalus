# Repo CI. Runs only on trusted triggers: never `pull_request_target`, so a fork's code
# never runs with this repository's token or secrets.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows runners take several times longer on the subprocess-heavy tests: leave them margin.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check
      # Linux and macOS run the full suite (subprocess and integration tests included). Windows
      # runners take about 5s per subprocess-heavy test, so the full suite there needs well over an
      # hour; they run every suite except tests/integration, which still covers the platform-
      # specific path, hook, pipe and git handling (unit, acceptance, security, recovery,
      # state_machine), plus the integration tests that only run on Windows (process-tree
      # containment). The rest of tests/integration runs on Linux and macOS.
      - name: Tests
        if: runner.os != 'Windows'
        run: python -m pytest -q
      - name: Tests (Windows, without the cross-platform integration tests)
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/unit tests/acceptance tests/security tests/recovery tests/state_machine tests/integration/test_session_control.py
