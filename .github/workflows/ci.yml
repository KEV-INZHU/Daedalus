# Repo CI. Runs only on trusted triggers: never `pull_request_target`, so a fork's code
# never runs with this repository's token or secrets.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The Pi and OpenCode plugin tests run their TypeScript/JS shims under Node (22.6+ strips types).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check
      # The full suite on every OS. In parallel (pytest-xdist): Windows runners take about 5s per
      # subprocess-heavy test, so one process would need well over an hour there.
      - name: Tests
        run: python -m pytest -q -n auto
