# Publish to PyPI when a version tag is pushed, via trusted publishing (no API token stored).
# One-time setup on pypi.org: add a trusted publisher for this repository, workflow
# `release.yml`, environment `pypi`. The version lives in one place, `daedalus.__version__`
# (pyproject.toml reads it); the tag must match it, and the test suite must pass first.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check
      - name: Tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Tag matches the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import glob, os, sys
          from email.parser import BytesParser
          from zipfile import ZipFile

          wheel = glob.glob("dist/*.whl")[0]
          with ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              version = BytesParser().parsebytes(z.read(name))["Version"]
          tag = os.environ["TAG"].removeprefix("v")
          if tag != version:
              sys.exit(f"tag {os.environ['TAG']} does not match the built version {version}")
          print(f"tag {os.environ['TAG']} matches version {version}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: the only job that gets this
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
