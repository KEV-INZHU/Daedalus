name: Bug report
description: Something in Daedalus doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through private reporting, not here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran, ideally from a fresh repository. `daedalus demo` output helps.
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: "`daedalus doctor` output"
      render: text
  - type: input
    id: version
    attributes:
      label: Daedalus version, Python version and OS
      placeholder: "0.2.0, Python 3.12, macOS 14"
    validations: {required: true}
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options: [Claude Code, Codex, OpenCode, Pi, Hermes, Plain terminal, Other]
