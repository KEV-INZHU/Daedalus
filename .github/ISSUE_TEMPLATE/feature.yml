name: Feature request
description: Suggest an improvement or a new harness integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would you like Daedalus to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
